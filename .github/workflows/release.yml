name: Release

# Push a tag like v1.2.0: runs the tests, builds a signed release APK and
# publishes it as a GitHub release. Signing key from repository secrets
# (see docs/architecture.md, "Release signing").
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # sqflite_common_ffi needs the native SQLite library for the tests.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Tests
        run: flutter test tests/

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi
          trim() { printf '%s' "$1" | tr -d '\r\n'; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d \
            > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$(trim "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(trim "$KEY_ALIAS")"
            echo "keyPassword=$(trim "$KEY_PASSWORD")"
          } > android/key.properties

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "cyclescope-$GITHUB_REF_NAME.apk"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "cyclescope-$GITHUB_REF_NAME.apk" \
            | tee signature.txt
          if grep -q "Android Debug" signature.txt; then
            echo "::error::APK is signed with a debug key."
            exit 1
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "cyclescope-$GITHUB_REF_NAME.apk" \
            --title "CycleScope $GITHUB_REF_NAME" \
            --generate-notes
