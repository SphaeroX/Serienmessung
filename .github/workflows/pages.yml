name: Pages

# Publishes site/ (landing page and the privacy policy for Google Play) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/branding/app_icon_512.png'
      - 'screenshots/**'
      - '.github/workflows/pages.yml'
  # Commits pushed by the Screenshots workflow do not trigger push events,
  # so redeploy once it has finished to pick up new screenshots.
  workflow_run:
    workflows: [Screenshots]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add app icon and screenshots
        run: |
          cp assets/branding/app_icon_512.png site/icon.png
          mkdir -p site/screenshots
          cp -r screenshots/en screenshots/de site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
