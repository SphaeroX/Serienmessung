name: Google Play

# Manually started (Actions tab → "Google Play" → Run workflow): runs the
# tests, builds a signed app bundle with the next free version code and
# uploads it to a Play Console track with fastlane (android/fastlane).
# Secrets: the ANDROID_* signing secrets and PLAY_SERVICE_ACCOUNT_JSON
# (see docs/architecture.md, "Google Play").
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "draft = upload only, roll out in the console; completed = release to the track"
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # sqflite_common_ffi needs the native SQLite library for the tests.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Tests
        run: flutter test tests/

      - name: Signing key
        uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Upload to Google Play
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          bundle exec fastlane internal
          track:${{ inputs.track }}
          status:${{ inputs.status }}
