name: Android release signing
description: Writes android/key.properties and the keystore from repository secrets.

inputs:
  keystore-base64: { required: true, description: Base64 of the .jks }
  keystore-password: { required: true, description: Keystore password }
  key-alias: { required: true, description: Key alias }
  key-password: { required: true, description: Key password }

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "::error::Release signing secrets are missing."
          exit 1
        fi
        trim() { printf '%s' "$1" | tr -d '\r\n'; }
        printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d \
          > "$RUNNER_TEMP/release.jks"
        {
          echo "storeFile=$RUNNER_TEMP/release.jks"
          echo "storePassword=$(trim "$KEYSTORE_PASSWORD")"
          echo "keyAlias=$(trim "$KEY_ALIAS")"
          echo "keyPassword=$(trim "$KEY_PASSWORD")"
        } > android/key.properties
